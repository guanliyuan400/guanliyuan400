        * { margin: 0; padding: 0; box-sizing: border-box; }

        .container { max-width: 1600px; margin: 0 auto; padding: 20px; }
        
        .filters { background: white; border-radius: 12px; padding: 16px 24px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); display: flex; gap: 20px; align-items: center; flex-wrap: wrap; }
        .filter-group { display: flex; align-items: center; gap: 8px; }
        .filter-group label { font-size: 13px; font-weight: 500; color: #666; white-space: nowrap; }
        .filter-group select { padding: 8px 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 13px; min-width: 140px; cursor: pointer; background: #fafafa; }
        .filter-group select:focus { outline: none; border-color: #2a5298; background: white; }
        .filter-group select[multiple] { min-height: 100px; }
        .filter-group input[type="date"] { padding: 7px 10px; border: 1px solid #ddd; border-radius: 6px; font-size: 13px; min-width: 130px; cursor: pointer; background: #fafafa; font-family: inherit; }
        .filter-group input[type="date"]:focus { outline: none; border-color: #2a5298; background: white; }
        .filter-separator { color: #999; font-size: 13px; }
        .date-preset { padding: 7px 14px; border: 1px solid #ddd; border-radius: 6px; font-size: 12px; cursor: pointer; background: #fafafa; color: #555; transition: all 0.2s; }
        .date-preset:hover { background: #2a5298; color: white; border-color: #2a5298; }
        
        .kpi-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 20px; }
        .kpi-card { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); cursor: pointer; transition: transform 0.2s, box-shadow 0.2s; }
        .kpi-card:hover { transform: translateY(-2px); box-shadow: 0 4px 16px rgba(0,0,0,0.1); }
        .kpi-card .label { font-size: 13px; color: #888; margin-bottom: 8px; }
        .kpi-card .value { font-size: 28px; font-weight: 700; color: #1e3c72; }
        .kpi-card .change { font-size: 12px; margin-top: 4px; }
        .kpi-card .change.up { color: #22c55e; }
        .kpi-card .change.down { color: #ef4444; }
        
        .charts-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
        .chart-card { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
        .chart-card.full { grid-column: 1 / -1; }
        .chart-card h3 { font-size: 15px; font-weight: 600; margin-bottom: 12px; color: #444; }
        .chart-card .chart { height: 350px; }
        
        .detail-panel { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); margin-bottom: 20px; display: none; }
        .detail-panel.active { display: block; }
        .detail-panel h3 { font-size: 16px; font-weight: 600; margin-bottom: 16px; color: #1e3c72; border-bottom: 2px solid #2a5298; padding-bottom: 8px; }
        .detail-panel .close-btn { float: right; background: none; border: none; font-size: 20px; cursor: pointer; color: #999; }
        .detail-panel .close-btn:hover { color: #333; }
        
        .data-table { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 12px; }
        .data-table th { background: #f8fafc; padding: 10px 12px; text-align: left; font-weight: 600; color: #555; border-bottom: 2px solid #e2e8f0; position: sticky; top: 0; }
        .data-table td { padding: 10px 12px; border-bottom: 1px solid #f1f5f9; }
        .data-table tr:hover { background: #f8fafc; }

    <div class="header">

    <div class="container">

        <div class="filters">

                <input type="date" id="dateStart" value="2026-08-01">

            <div class="filter-group">
                <label>快捷：</label>
                <button class="date-preset" onclick="setDateRange('all')">全部</button>
                <button class="date-preset" onclick="setDateRange('week')">本周</button>
                <button class="date-preset" onclick="setDateRange('month')">本月</button>
            </div>
            <div class="filter-group">
                <label>门店：</label>
                <select id="storeFilter">
                    <option value="all">全部门店</option>
                </select>
            </div>
            <div class="filter-group">
                <label>业务类型：</label>
                <select id="channelFilter">
                    <option value="all">全部渠道</option>
                    <option value="店内销售">店内销售</option>
                    <option value="美团外卖">美团外卖</option>
                    <option value="淘宝闪购">淘宝闪购</option>
                    <option value="京东秒送">京东秒送</option>
                </select>
            </div>
            <div class="filter-group">
                <label>对比：</label>
                <button class="date-preset" id="btnCompare" onclick="toggleCompare()">+ 添加对比</button>
            </div>
            <div class="filter-group" id="compareOpts" style="display:none;align-items:center;gap:8px">
                <select id="compareMode" onchange="updateCompareDate()">
                    <option value="prevDay">前一天</option>
                    <option value="prevWeek">上周同日</option>
                    <option value="custom">自定义</option>
                </select>
                <input type="date" id="compareDate" style="display:none" onchange="updateDashboard()">
                <span id="compareDateLabel" style="font-size:13px;color:#666"></span>
                <button class="date-preset" onclick="closeCompare()" title="关闭对比">&times;</button>
            </div>
            <div class="filter-group">
                <label>分组方式：</label>
                <select id="groupFilter">
                    <option value="date">按日期</option>
                    <option value="store">按门店</option>
                </select>
            </div>
        </div>
        
        <!-- KPI Cards -->
        <div class="kpi-row">
            <div class="kpi-card" onclick="scrollToDetail()">
                <div class="label">总营业额（元）</div>
                <div class="value" id="kpiRevenue">-</div>
                <div class="change" id="kpiRevenueChange">-</div>
            </div>
            <div class="kpi-card" onclick="scrollToDetail()">
                <div class="label">总营业收入（元）</div>
                <div class="value" id="kpiIncome">-</div>
                <div class="change" id="kpiIncomeChange">-</div>
            </div>
            <div class="kpi-card" onclick="scrollToDetail()">
                <div class="label">总订单量</div>
                <div class="value" id="kpiOrders">-</div>
                <div class="change" id="kpiOrdersChange">-</div>
            </div>
            <div class="kpi-card" onclick="scrollToDetail()">
                <div class="label">平均到手率</div>
                <div class="value" id="kpiRate">-</div>
                <div class="change" id="kpiRateChange">-</div>
            </div>
        </div>
        
        <!-- Comparison Panel -->
        <div class="charts-grid" id="compareSection" style="display:none">
            <div class="chart-card full">
                <h3 id="compareTitle">数据对比</h3>
                <div id="compareCards" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:16px"></div>
                <div id="compareBarChart" style="height:300px"></div>
            </div>
        </div>

        <!-- Charts -->
        <div class="charts-grid">
            <div class="chart-card">
                <h3>收入趋势（点击数据点查看详情）</h3>
                <div class="chart" id="chartRevenue"></div>
            </div>
            <div class="chart-card">
                <h3>营业收入与优惠金额对比（点击数据点查看详情）</h3>
                <div class="chart" id="chartProfit"></div>
            </div>
            <div class="chart-card full">
                <h3>订单量趋势（点击数据点查看详情）</h3>
                <div class="chart" id="chartOrders"></div>
            </div>
        </div>
        
        <!-- Detail Panel -->
        <div class="detail-panel" id="detailPanel">
            <button class="close-btn" onclick="closeDetail()">&times;</button>
            <h3 id="detailTitle">数据明细</h3>
            <div id="detailContent"></div>
        </div>
        
        <!-- Data Table -->
        <div class="chart-card">
            <h3>数据汇总表</h3>
            <div class="table-wrapper">
                <table class="data-table" id="dataTable">
                    <thead>
                        <tr>
                            <th>日期</th>
                            <th>门店</th>
                            <th class="num">营业额</th>
                            <th class="num">营业收入</th>
                            <th class="num">优惠金额</th>
                            <th class="num">订单量</th>
                            <th class="num">用餐人数</th>
                            <th class="num">到手率</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    let filteredData = [...RAW_DATA];
    let charts = {};

    function init() {
        populateStoreFilter();
        initCharts();
        updateDashboard();
        bindFilterEvents();
        updateHeaderDate();
    }

    function updateHeaderDate() {
        const dates = RAW_DATA.map(d => d.date).sort();
        const minDate = dates[0].replace(/-/g, '/');
        const maxDate = dates[dates.length - 1].replace(/-/g, '/');
        document.querySelector('.header p').textContent = `营业统计周期：${minDate} - ${maxDate} | 共${new Set(RAW_DATA.map(d => d.store)).size}家门店`;
    }

    function populateStoreFilter() {
        const select = document.getElementById('storeFilter');
        const stores = [...new Set(RAW_DATA.map(d => d.store))].sort();
        stores.forEach(s => {
            const opt = document.createElement('option');
            opt.value = s;
            opt.textContent = s.replace('milkplus（', '').replace('）', '');
            select.appendChild(opt);
        });
    }

    function bindFilterEvents() {
        ['storeFilter', 'channelFilter', 'groupFilter'].forEach(id => {
            document.getElementById(id).addEventListener('change', updateDashboard);
        });
        document.getElementById('dateStart').addEventListener('change', function() { updateCompareDate(); });
        document.getElementById('dateEnd').addEventListener('change', function() { updateCompareDate(); });
    }

    function setDateRange(preset) {
        const dates = RAW_DATA.map(d => d.date).sort();
        const minDate = dates[0];
        const maxDate = dates[dates.length - 1];

        let start = minDate;
        let end = maxDate;

        if (preset === 'week') {
            const today = maxDate;
            const d = new Date(today);
            d.setDate(d.getDate() - 6);
            start = d.toISOString().slice(0, 10);
            end = today;
        } else if (preset === 'month') {
            const today = maxDate;
            const d = new Date(today);
            d.setDate(1);
            start = d.toISOString().slice(0, 10);
            end = today;
        }

        document.getElementById('dateStart').value = start;
        document.getElementById('dateEnd').value = end;
        updateDashboard();
    }

    function getFilteredData() {
        const dateStart = document.getElementById('dateStart').value;
        const dateEnd = document.getElementById('dateEnd').value;
        const store = document.getElementById('storeFilter').value;
        const channel = document.getElementById('channelFilter').value;

        let data = RAW_DATA.filter(d => {
            if (dateStart && d.date < dateStart) return false;
            if (dateEnd && d.date > dateEnd) return false;
            if (store !== 'all' && d.store !== store) return false;
            return true;
        });

        if (channel !== 'all') {
            data = data.map(d => ({
                ...d,
                revenue: d.channels[channel]?.revenue || 0,
                income: d.channels[channel]?.income || 0,
                discount: d.channels[channel]?.discount || 0,
                orders: d.channels[channel]?.orders || 0,
                diners: 0,
            }));
        }

        return data;
    }

    function aggregateByDate(data) {
        const map = {};
        data.forEach(d => {
            if (!map[d.date]) {
                map[d.date] = { date: d.date, revenue: 0, income: 0, discount: 0, orders: 0, diners: 0, count: 0 };
            }
            map[d.date].revenue += d.revenue;
            map[d.date].income += d.income;
            map[d.date].discount += d.discount;
            map[d.date].orders += d.orders;
            map[d.date].diners += d.diners;
            map[d.date].count++;
        });
        return Object.values(map).sort((a, b) => a.date.localeCompare(b.date));
    }

    function aggregateByStore(data) {
        const map = {};
        data.forEach(d => {
            if (!map[d.store]) {
                map[d.store] = { store: d.store, revenue: 0, income: 0, discount: 0, orders: 0, diners: 0, count: 0 };
            }
            map[d.store].revenue += d.revenue;
            map[d.store].income += d.income;
            map[d.store].discount += d.discount;
            map[d.store].orders += d.orders;
            map[d.store].diners += d.diners;
            map[d.store].count++;
        });
        return Object.values(map).sort((a, b) => b.revenue - a.revenue);
    }

    let compareEnabled = false;

    function toggleCompare() {
        compareEnabled = !compareEnabled;
        if (compareEnabled) {
            document.getElementById('compareOpts').style.display = 'flex';
            document.getElementById('btnCompare').textContent = '取消对比';
            updateCompareDate();
        } else {
            closeCompare();
        }
    }

    function closeCompare() {
        compareEnabled = false;
        document.getElementById('compareOpts').style.display = 'none';
        document.getElementById('btnCompare').textContent = '+ 添加对比';
        document.getElementById('compareSection').style.display = 'none';
        // Reset compare chart if it exists
        if (charts.compare) {
            charts.compare.clear();
        }
    }

    function updateCompareDate() {
        if (!compareEnabled) return;
        const dateEnd = document.getElementById('dateEnd').value;
        const mode = document.getElementById('compareMode').value;
        const input = document.getElementById('compareDate');
        const label = document.getElementById('compareDateLabel');

        if (mode === 'custom') {
            input.style.display = '';
            label.textContent = '';
            if (!input.value) {
                input.value = dateEnd;
            }
        } else {
            input.style.display = 'none';
            const d = new Date(dateEnd);
            if (mode === 'prevDay') {
                d.setDate(d.getDate() - 1);
            } else if (mode === 'prevWeek') {
                d.setDate(d.getDate() - 7);
            }
            const targetDate = d.toISOString().slice(0, 10);
            input.value = targetDate;
            label.textContent = targetDate;
        }
        updateDashboard();
    }

    function updateDashboard() {
        const data = getFilteredData();
        const groupBy = document.getElementById('groupFilter').value;
        const aggregated = groupBy === 'date' ? aggregateByDate(data) : aggregateByStore(data);

        updateKPIs(data);
        updateCharts(aggregated, groupBy);
        updateTable(data);

        // Handle comparison
        const compareSection = document.getElementById('compareSection');
        const dateEnd = document.getElementById('dateEnd').value;
        const compareTarget = document.getElementById('compareDate').value;

        if (compareEnabled && dateEnd && compareTarget) {
            compareSection.style.display = '';
            renderComparison(dateEnd, compareTarget, aggregated);
        } else {
            compareSection.style.display = 'none';
        }
    }

    function updateKPIs(data) {
        const totalRevenue = data.reduce((s, d) => s + d.revenue, 0);
        const totalIncome = data.reduce((s, d) => s + d.income, 0);
        const totalOrders = data.reduce((s, d) => s + d.orders, 0);
        const avgRate = totalRevenue > 0 ? (totalIncome / totalRevenue * 100) : 0;

        document.getElementById('kpiRevenue').textContent = formatMoney(totalRevenue);
        document.getElementById('kpiIncome').textContent = formatMoney(totalIncome);
        document.getElementById('kpiOrders').textContent = totalOrders.toLocaleString();
        document.getElementById('kpiRate').textContent = avgRate.toFixed(1) + '%';
    }

    let currentAggregated = [];
    let currentGroupBy = 'date';

    function updateCharts(data, groupBy) {
        currentAggregated = data;
        currentGroupBy = groupBy;
        const labels = groupBy === 'date' 
            ? data.map(d => d.date.slice(5)) 
            : data.map(d => d.store.replace('milkplus（', '').replace('）', ''));

        // Revenue chart
        charts.revenue.setOption({
            xAxis: { data: labels },
            series: [{
                data: data.map(d => d.revenue)
            }]
        });

        // Profit chart
        charts.profit.setOption({
            xAxis: { data: labels },
            series: [
                { data: data.map(d => d.income) },
                { data: data.map(d => d.discount) }
            ]
        });

        // Orders chart
        charts.orders.setOption({
            xAxis: { data: labels },
            series: [{
                data: data.map(d => d.orders)
            }]
        });
    }

    function updateTable(data) {
        const tbody = document.getElementById('tableBody');
        const sorted = [...data].sort((a, b) => b.date.localeCompare(a.date) || a.store.localeCompare(b.store));
        tbody.innerHTML = sorted.map(d => `
            <tr>
                <td>${d.date}</td>
                <td>${d.store.replace('milkplus（', '').replace('）', '')}</td>
                <td class="num">${formatMoney(d.revenue)}</td>
                <td class="num">${formatMoney(d.income)}</td>
                <td class="num">${formatMoney(d.discount)}</td>
                <td class="num">${d.orders.toLocaleString()}</td>

                <td class="num">${d.revenue > 0 ? (d.income / d.revenue * 100).toFixed(1) : '0'}%</td>
            </tr>
        `).join('');
    }

            if (!dayData.length) return null;
            return {
                revenue: dayData.reduce((s, d) => s + d.revenue, 0),
                income: dayData.reduce((s, d) => s + d.income, 0),
                discount: dayData.reduce((s, d) => s + d.discount, 0),
                orders: dayData.reduce((s, d) => s + d.orders, 0),
                diners: dayData.reduce((s, d) => s + d.diners, 0),
            };
        };

        if (!charts.compare) {
            charts.compare = echarts.init(document.getElementById('compareBarChart'));
        }
        setTimeout(() => charts.compare.resize(), 50);

        const target = findItem(targetDate);
        const compare = findItem(compareDate);

        if (!target || !compare) {
            document.getElementById('compareCards').innerHTML = '<p style="color:#999">所选日期范围内无数据</p>';
            charts.compare.clear();
            return;
        }

        // Render comparison cards
        const metrics = [
            { name: '营业额', val1: target.revenue, val2: compare.revenue, unit: '元' },
            { name: '营业收入', val1: target.income, val2: compare.income, unit: '元' },
            { name: '订单量', val1: target.orders, val2: compare.orders, unit: '单' },
            { name: '用餐人数', val1: target.diners, val2: compare.diners, unit: '人' },
        ];

        document.getElementById('compareCards').innerHTML = metrics.map(m => {
            const diff = m.val1 - m.val2;
            const pct = m.val2 > 0 ? ((diff / m.val2) * 100) : 0;
            const arrow = pct >= 0 ? '↑' : '↓';
            const color = pct >= 0 ? '#22c55e' : '#ef4444';
            const fmt = (v) => m.unit === '元' ? Math.round(v).toLocaleString() : v.toLocaleString();
            return `<div style="background:#f8fafc;border-radius:8px;padding:14px">
                <div style="font-size:12px;color:#888">${m.name}</div>
                <div style="display:flex;justify-content:space-between;margin-top:6px">
                    <div>
                        <div style="font-size:11px;color:#999">${targetDate.slice(5)}</div>
                        <div style="font-size:20px;font-weight:700;color:#1e3c72">${fmt(m.val1)}</div>
                    </div>
                    <div style="text-align:right">
                        <div style="font-size:11px;color:#999">${compareDate.slice(5)}</div>
                        <div style="font-size:15px;color:#666">${fmt(m.val2)}</div>
                    </div>
                </div>
                <div style="margin-top:6px;font-size:13px;color:${color};font-weight:600">
                    ${arrow} ${Math.abs(diff).toLocaleString()}${m.unit === '元' ? '元' : m.unit === '单' ? '单' : '人'} (${Math.abs(pct).toFixed(1)}%)
                </div>
            </div>`;
        }).join('');

        document.getElementById('compareTitle').textContent = `数据对比：${targetDate.slice(5)} vs ${compareDate.slice(5)}`;

        // Render bar chart - side by side comparison
        charts.compare.setOption({
            tooltip: {
                trigger: 'axis',
                axisPointer: { type: 'shadow' },
                formatter: params => params.map(p => p.marker + p.seriesName + ': ' + Math.round(p.value).toLocaleString()).join('<br>')
            },
            legend: { data: [targetDate.slice(5), compareDate.slice(5)], top: 0 },
            xAxis: { type: 'category', data: ['营业额', '营业收入', '订单量(十)', '用餐人数'] },
            yAxis: { type: 'value' },
            series: [
                { name: targetDate.slice(5), type: 'bar', data: [target.revenue, target.income, target.orders / 10, target.diners], itemStyle: { color: '#2a5298', borderRadius: [4, 4, 0, 0] }, barWidth: '35%' },
                { name: compareDate.slice(5), type: 'bar', data: [compare.revenue, compare.income, compare.orders / 10, compare.diners], itemStyle: { color: '#94a3b8', borderRadius: [4, 4, 0, 0] }, barWidth: '35%' }
            ],
            grid: { left: 60, right: 20, top: 40, bottom: 30 }
        }, true);
    }

    function showDetail(category, label, dataPoint) {
        const panel = document.getElementById('detailPanel');
        const title = document.getElementById('detailTitle');
        const content = document.getElementById('detailContent');

        title.textContent = `${label} - 数据明细`;

        // Find matching data from currentAggregated
        const item = currentAggregated.find(d => {
            if (currentGroupBy === 'date') {
                return d.date.slice(5) === label || d.date === label;
            } else {
                return d.store.includes(label) || d.store.replace('milkplus（', '').replace('）', '') === label;
            }
        });

        if (!item) {
            content.innerHTML = '<p style="color:#999">未找到匹配数据</p>';
        } else {
            // Filter raw data for this item
            let matchingRows = [];
            const channel = document.getElementById('channelFilter').value;

            if (currentGroupBy === 'date') {
                // Show all stores for this date
                matchingRows = RAW_DATA.filter(d => d.date === item.date || d.date.slice(5) === label);
            } else {
                // Show all dates for this store
                matchingRows = RAW_DATA.filter(d => d.store === item.store || d.store.includes(label));
            }

            let rows = '';
            matchingRows.sort((a, b) => a.store.localeCompare(b.store)).forEach(d => {
                rows += `<tr style="font-weight:600;border-top:2px solid #e2e8f0">
                    <td>${currentGroupBy === 'date' ? d.store.replace('milkplus（', '').replace('）', '') : d.date.slice(5)}</td>
                    <td class="num">${formatMoney(d.revenue)}</td>
                    <td class="num">${formatMoney(d.income)}</td>
                    <td class="num">${formatMoney(d.discount)}</td>
                    <td class="num">${d.orders.toLocaleString()}</td>
                    <td class="num">${d.revenue > 0 ? (d.income / d.revenue * 100).toFixed(1) : '0'}%</td>
                </tr>`;
                if (channel === 'all') {
                    ['店内销售', '美团外卖', '淘宝闪购', '京东秒送'].forEach(ch => {
                        const c = d.channels[ch];
                        if (c && c.revenue > 0) {
                            rows += `<tr style="background:#f8fafc;font-size:12px">
                                <td style="padding-left:30px;color:#666">&#8226; ${ch}</td>
                                <td class="num">${formatMoney(c.revenue)}</td>
                                <td class="num">${formatMoney(c.income)}</td>
                                <td class="num">${formatMoney(c.discount)}</td>
                                <td class="num">${c.orders}</td>
                                <td></td>
                            </tr>`;
                        }
                    });
                }
            });

            content.innerHTML = `
                <div class="table-wrapper">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>${currentGroupBy === 'date' ? '门店' : '日期'}</th>
                                <th class="num">营业额(元)</th>
                                <th class="num">营业收入(元)</th>
                                <th class="num">优惠金额(元)</th>
                                <th class="num">订单量</th>
                                <th class="num">到手率</th>
                            </tr>
                        </thead>
                        <tbody>${rows}</tbody>
                    </table>
                </div>
                <p style="margin-top:10px;font-size:12px;color:#999">共 ${matchingRows.length} 条记录 | 点击每条记录可查看各渠道明细</p>
            `;
        }

        panel.classList.add('active');
        panel.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    function closeDetail() {
        document.getElementById('detailPanel').classList.remove('active');
    }

    function scrollToDetail() {
        document.getElementById('detailPanel').scrollIntoView({ behavior: 'smooth' });
    }

    function formatMoney(val) {
        return Math.round(val).toLocaleString();
    }

    // Handle resize
    window.addEventListener('resize', () => {
        Object.values(charts).forEach(c => c && c.resize());
    });

    init();
    </script>
</body>
</html>
