        .filter-group { display: flex; align-items: center; gap: 8px; }
        .filter-group label { font-size: 13px; font-weight: 500; color: #666; white-space: nowrap; }
        .filter-group select { padding: 8px 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 13px; min-width: 140px; cursor: pointer; background: #fafafa; }
        .filter-group select:focus { outline: none; border-color: #2a5298; background: white; }
        .filter-group select[multiple] { min-height: 100px; }
        .filter-group input[type="date"] { padding: 7px 10px; border: 1px solid #ddd; border-radius: 6px; font-size: 13px; min-width: 130px; cursor: pointer; background: #fafafa; font-family: inherit; }
        .filter-group input[type="date"]:focus { outline: none; border-color: #2a5298; background: white; }
        .filter-separator { color: #999; font-size: 13px; }

        .kpi-card { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); cursor: pointer; transition: transform 0.2s, box-shadow 0.2s; }
        .kpi-card:hover { transform: translateY(-2px); box-shadow: 0 4px 16px rgba(0,0,0,0.1); }
        .kpi-card .label { font-size: 13px; color: #888; margin-bottom: 8px; }
        .kpi-card .value { font-size: 28px; font-weight: 700; color: #1e3c72; }
        .kpi-card .change { font-size: 12px; margin-top: 4px; }
        .kpi-card .change.up { color: #22c55e; }
        .kpi-card .change.down { color: #ef4444; }
        
        .charts-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
        .chart-card { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
        .chart-card.full { grid-column: 1 / -1; }
        .chart-card h3 { font-size: 15px; font-weight: 600; margin-bottom: 12px; color: #444; }
        .chart-card .chart { height: 350px; }
        
        .detail-panel { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); margin-bottom: 20px; display: none; }
        .detail-panel.active { display: block; }
        .detail-panel h3 { font-size: 16px; font-weight: 600; margin-bottom: 16px; color: #1e3c72; border-bottom: 2px solid #2a5298; padding-bottom: 8px; }
        .detail-panel .close-btn { float: right; background: none; border: none; font-size: 20px; cursor: pointer; color: #999; }
        .detail-panel .close-btn:hover { color: #333; }
        
        .data-table { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 12px; }
        .data-table th { background: #f8fafc; padding: 10px 12px; text-align: left; font-weight: 600; color: #555; border-bottom: 2px solid #e2e8f0; position: sticky; top: 0; }
        .data-table td { padding: 10px 12px; border-bottom: 1px solid #f1f5f9; }
        .data-table tr:hover { background: #f8fafc; }
        .data-table .num { text-align: right; font-variant-numeric: tabular-nums; }
        
        .table-wrapper { max-height: 400px; overflow-y: auto; border-radius: 8px; border: 1px solid #e2e8f0; }
        
        @media (max-width: 1200px) {
            .charts-grid { grid-template-columns: 1fr; }
        }
        /* Color picker panel */
        .color-panel {
            position: fixed;
            top: 0;
            right: -320px;
            width: 300px;
            height: 100vh;
            background: white;
            box-shadow: -4px 0 20px rgba(0,0,0,0.15);
            z-index: 1000;
            transition: right 0.3s ease;
            overflow-y: auto;
            padding: 20px;
        }
        .color-panel.open { right: 0; }
        .color-panel h3 { font-size: 16px; margin-bottom: 16px; color: #1e3c72; }
        .color-panel .close-panel { position: absolute; top: 15px; right: 15px; background: none; border: none; font-size: 22px; cursor: pointer; color: #999; }
        .color-item { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #f1f5f9; }
        .color-item label { font-size: 13px; color: #555; }
        .color-item input[type="color"] { width: 40px; height: 28px; border: none; border-radius: 4px; cursor: pointer; padding: 0; }
        .color-item .color-values { display: flex; align-items: center; gap: 6px; }
        .btn-apply-colors { width: 100%; padding: 10px; background: #2a5298; color: white; border: none; border-radius: 6px; font-size: 14px; cursor: pointer; margin-top: 16px; }
        .btn-apply-colors:hover { background: #1e3c72; }
        .btn-reset-colors { width: 100%; padding: 8px; background: none; color: #666; border: 1px solid #ddd; border-radius: 6px; font-size: 13px; cursor: pointer; margin-top: 8px; }

<body>
    <div class="header">
        <h1>Milkplus 集团经营数据看板</h1>
        <p>营业统计周期：2026年8月1日 - 8月7日 | 共11家门店</p>
    </div>
    
    <div class="container">
        <!-- Filters -->
        <div class="filters">
            <div class="filter-group">
                <label>日期：</label>
                <input type="date" id="dateStart">
                <span class="filter-separator">至</span>
                <input type="date" id="dateEnd">
            </div>
            <div class="filter-group">
                <label>快捷：</label>
                <button class="date-preset" onclick="setDateRange('all')">全部</button>
                <button class="date-preset" onclick="setDateRange('week')">本周</button>
                <button class="date-preset" onclick="setDateRange('month')">本月</button>
            </div>
            <div class="filter-group">
                <label>门店：</label>
                <select id="storeFilter" multiple size="1" style="min-height:36px">
                    <option value="all" selected>全部门店</option>
                </select>
            </div>
            <div class="filter-group">
                <label>业务类型：</label>
                <select id="channelFilter" multiple size="1" style="min-height:36px">
                    <option value="all" selected>全部渠道</option>
                    <option value="店内销售">店内销售</option>
                    <option value="美团外卖">美团外卖</option>
                    <option value="淘宝闪购">淘宝闪购</option>
                    <option value="京东秒送">京东秒送</option>
                </select>
            </div>
            <div class="filter-group">
                <label>对比：</label>
                <button class="date-preset" id="btnCompare" onclick="toggleCompare()">+ 添加对比</button>
            </div>
            <div class="filter-group" id="compareOpts" style="display:none;align-items:center;gap:8px">
                <select id="compareMode" onchange="updateCompareDate()">
                    <option value="prevDay">前一天</option>
                    <option value="prevWeek">上周同日</option>
                    <option value="range">日期区间</option>
                    <option value="custom">单日</option>
                </select>
                <span id="compareDateRange" style="display:none;align-items:center;gap:6px">
                    <input type="date" id="compareStart" onchange="updateDashboard()">
                    <span style="font-size:12px;color:#999">至</span>
                    <input type="date" id="compareEnd" onchange="updateDashboard()">
                </span>
                <input type="date" id="compareDate" style="display:none" onchange="updateDashboard()">
                <span id="compareDateLabel" style="font-size:13px;color:#666"></span>
                <button class="date-preset" onclick="closeCompare()" title="关闭对比">&times;</button>
            </div>
            <div class="filter-group">
                <label>分组方式：</label>
                <select id="groupFilter">
                    <option value="date">按日期</option>
                    <option value="store">按门店</option>
                </select>
            </div>
            <div class="filter-group">
                <button class="toggle-colors-btn" onclick="toggleColorPanel()">🎨 配色</button>
            </div>
        </div>
        <!-- Color Picker Panel -->
        <div class="color-panel" id="colorPanel">
            <button class="close-panel" onclick="toggleColorPanel()">&times;</button>
            <h3>🎨 图表配色方案</h3>
            <div class="color-item"><label>营业额柱色</label><div class="color-values"><input type="color" id="colRevenue" value="#2a5298"></div></div>
            <div class="color-item"><label>营业收入色</label><div class="color-values"><input type="color" id="colIncome" value="#22c55e"></div></div>
            <div class="color-item"><label>优惠金额色</label><div class="color-values"><input type="color" id="colDiscount" value="#f97316"></div></div>
            <div class="color-item"><label>订单量线色</label><div class="color-values"><input type="color" id="colOrders" value="#7c3aed"></div></div>
            <div class="color-item"><label>营业额单均色</label><div class="color-values"><input type="color" id="colAvgRev" value="#f59e0b"></div></div>
            <div class="color-item"><label>营业收入单均色</label><div class="color-values"><input type="color" id="colAvgInc" value="#06b6d4"></div></div>
            <button class="btn-apply-colors" onclick="applyColors()">应用配色</button>
            <button class="btn-reset-colors" onclick="resetColors()">恢复默认</button>
        </div>
        
        <!-- KPI Cards -->
        <div class="kpi-row">
            <div class="kpi-card" onclick="scrollToDetail()">
                <div class="label">总营业额（元）</div>
                <div class="value" id="kpiRevenue">-</div>
                <div class="change" id="kpiRevenueChange">-</div>
            </div>
            <div class="kpi-card" onclick="scrollToDetail()">
                <div class="label">总营业收入（元）</div>
                <div class="value" id="kpiIncome">-</div>
                <div class="change" id="kpiIncomeChange">-</div>
            </div>
            <div class="kpi-card" onclick="scrollToDetail()">
                <div class="label">总订单量</div>
                <div class="value" id="kpiOrders">-</div>
                <div class="change" id="kpiOrdersChange">-</div>
            </div>
            <div class="kpi-card" onclick="scrollToDetail()">
                <div class="label">营业额单均（元）</div>
                <div class="value" id="kpiRate">-</div>
                <div class="change" id="kpiRateChange">-</div>
            </div>
            <div class="kpi-card" onclick="scrollToDetail()">
                <div class="label">营业收入单均（元）</div>
                <div class="value" id="kpiIncomeAvg">-</div>
                <div class="change" id="kpiIncomeAvgChange">-</div>
            </div>
        </div>
        
        <!-- Comparison Panel -->
        <div class="charts-grid" id="compareSection" style="display:none">
            <div class="chart-card full">
                <h3 id="compareTitle">数据对比</h3>
                <div id="compareCards" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:16px"></div>
                <div id="compareBarChart" style="height:300px"></div>
            </div>
        </div>

        <!-- Charts -->
        <div class="charts-grid">
            <div class="chart-card">
                <h3>营业额趋势（点击数据点查看详情）</h3>
                <div class="chart" id="chartRevenue"></div>
            </div>
            <div class="chart-card">
                <h3>营业收入与优惠金额对比（点击数据点查看详情）</h3>
                <div class="chart" id="chartProfit"></div>
            </div>
            <div class="chart-card full">
                <h3>订单量趋势（点击数据点查看详情）</h3>
                <div class="chart" id="chartOrders"></div>
            </div>
            <div class="chart-card full">
                <h3>单均数据趋势（点击数据点查看详情）</h3>
                <div class="chart" id="chartAvg" style="height:320px"></div>
            </div>
        </div>
        
        <!-- Detail Panel -->
        <div class="detail-panel" id="detailPanel">
            <button class="close-btn" onclick="closeDetail()">&times;</button>
            <h3 id="detailTitle">数据明细</h3>
            <div id="detailContent"></div>
        </div>
        
        <!-- Data Table -->
        <div class="chart-card">
            <h3>数据汇总表</h3>
            <div class="table-wrapper">
                <table class="data-table" id="dataTable">
                    <thead>
                        <tr>
                            <th>日期</th>
                            <th>门店</th>
                            <th class="num">营业额</th>
                            <th class="num">营业收入</th>
                            <th class="num">优惠金额</th>
                            <th class="num">订单量</th>
                            <th class="num">营业额单均</th>
                            <th class="num">营业收入单均</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody"></tbody>
                </table>
            </div>
        </div>
    </div>

            document.getElementById('dateEnd').value = dates[dates.length - 1];
        }
        populateStoreFilter();
        initCharts();
        updateDashboard();
        bindFilterEvents();
        updateHeaderDate();
    }

    function updateHeaderDate() {
        const dates = RAW_DATA.map(d => d.date).sort();
        const minDate = dates[0].replace(/-/g, '/');
        const maxDate = dates[dates.length - 1].replace(/-/g, '/');
        document.querySelector('.header p').textContent = `营业统计周期：${minDate} - ${maxDate} | 共${new Set(RAW_DATA.map(d => d.store)).size}家门店`;
    }

    function populateStoreFilter() {
        const select = document.getElementById('storeFilter');
        const stores = [...new Set(RAW_DATA.map(d => d.store))].sort();
        stores.forEach(s => {
            const opt = document.createElement('option');
            opt.value = s;
            opt.textContent = s.replace('milkplus（', '').replace('）', '');
            select.appendChild(opt);
        });
    }

    function bindFilterEvents() {
        ['storeFilter', 'channelFilter', 'groupFilter'].forEach(id => {
            document.getElementById(id).addEventListener('change', updateDashboard);
        });
        document.getElementById('dateStart').addEventListener('change', function() { updateCompareDate(); });
        document.getElementById('dateEnd').addEventListener('change', function() { updateCompareDate(); });
    }

    function setDateRange(preset) {
        const dates = RAW_DATA.map(d => d.date).sort();
        const minDate = dates[0];
        const maxDate = dates[dates.length - 1];

        let start = minDate;
        let end = maxDate;

        if (preset === 'week') {
            const today = maxDate;
            const d = new Date(today);
            d.setDate(d.getDate() - 6);
            start = d.toISOString().slice(0, 10);
            end = today;
        } else if (preset === 'month') {
            const today = maxDate;
            const d = new Date(today);
            d.setDate(1);
            start = d.toISOString().slice(0, 10);
            end = today;
        }

        document.getElementById('dateStart').value = start;
        document.getElementById('dateEnd').value = end;
        updateDashboard();
    }

    function getSelectedValues(selectEl) {
        const selected = Array.from(selectEl.selectedOptions).map(o => o.value);
        return selected;
    }

    function getFilteredData() {
        const dateStart = document.getElementById('dateStart').value;
        const dateEnd = document.getElementById('dateEnd').value;
        const storeSelected = getSelectedValues(document.getElementById('storeFilter'));
        const channelSelected = getSelectedValues(document.getElementById('channelFilter'));

        const storeAll = storeSelected.includes('all');
        const channelAll = channelSelected.includes('all');

        let data = RAW_DATA.filter(d => {
            if (dateStart && d.date < dateStart) return false;
            if (dateEnd && d.date > dateEnd) return false;
            if (!storeAll && !storeSelected.includes(d.store)) return false;
            return true;
        });

        if (!channelAll && channelSelected.length > 0) {
            data = data.map(d => {
                let revenue = 0, income = 0, discount = 0, orders = 0;
                channelSelected.forEach(ch => {
                    if (d.channels[ch]) {
                        revenue += d.channels[ch].revenue;
                        income += d.channels[ch].income;
                        discount += d.channels[ch].discount;
                        orders += d.channels[ch].orders;
                    }
                });
                return { ...d, revenue, income, discount, orders, diners: 0 };
            });
        }

        return data;
    }

    function aggregateByDate(data) {
        const map = {};
        data.forEach(d => {
            if (!map[d.date]) {
                map[d.date] = { date: d.date, revenue: 0, income: 0, discount: 0, orders: 0, diners: 0, count: 0 };
            }
            map[d.date].revenue += d.revenue;
            map[d.date].income += d.income;
            map[d.date].discount += d.discount;
            map[d.date].orders += d.orders;
            map[d.date].diners += d.diners;
            map[d.date].count++;
        });
        return Object.values(map).sort((a, b) => a.date.localeCompare(b.date));
    }

    function aggregateByStore(data) {
        const map = {};
        data.forEach(d => {
            if (!map[d.store]) {
                map[d.store] = { store: d.store, revenue: 0, income: 0, discount: 0, orders: 0, diners: 0, count: 0 };
            }
            map[d.store].revenue += d.revenue;
            map[d.store].income += d.income;
            map[d.store].discount += d.discount;
            map[d.store].orders += d.orders;
            map[d.store].diners += d.diners;
            map[d.store].count++;
        });
        return Object.values(map).sort((a, b) => b.revenue - a.revenue);
    }

    let compareEnabled = false;

    function toggleCompare() {
        compareEnabled = !compareEnabled;
        if (compareEnabled) {
            document.getElementById('compareOpts').style.display = 'flex';
            document.getElementById('btnCompare').textContent = '取消对比';
            updateCompareDate();
        } else {
            closeCompare();
        }
    }

    function closeCompare() {
        compareEnabled = false;
        document.getElementById('compareOpts').style.display = 'none';
        document.getElementById('btnCompare').textContent = '+ 添加对比';
        document.getElementById('compareSection').style.display = 'none';
        // Reset compare chart if it exists
        if (charts.compare) {
            charts.compare.clear();
        }
    }

    function updateCompareDate() {
        if (!compareEnabled) {
            updateDashboard();
            return;
        }
        const dateEnd = document.getElementById('dateEnd').value;
        const mode = document.getElementById('compareMode').value;
        const singleInput = document.getElementById('compareDate');
        const label = document.getElementById('compareDateLabel');
        const rangeWrap = document.getElementById('compareDateRange');
        const rangeStart = document.getElementById('compareStart');
        const rangeEnd = document.getElementById('compareEnd');

        singleInput.style.display = 'none';
        rangeWrap.style.display = 'none';
        label.textContent = '';

        if (mode === 'range') {
            rangeWrap.style.display = 'flex';
            if (!rangeEnd.value) rangeEnd.value = dateEnd;
            if (!rangeStart.value) {
                const d = new Date(dateEnd);
                d.setDate(d.getDate() - 6);
                rangeStart.value = d.toISOString().slice(0, 10);
            }
        } else if (mode === 'custom') {
            singleInput.style.display = '';
            if (!singleInput.value) singleInput.value = dateEnd;
        } else {
            const d = new Date(dateEnd);
            if (mode === 'prevDay') {
                d.setDate(d.getDate() - 1);
            } else if (mode === 'prevWeek') {
                d.setDate(d.getDate() - 7);
            }
            singleInput.value = d.toISOString().slice(0, 10);
            label.textContent = singleInput.value;
        }
        updateDashboard();
    }

    function updateDashboard() {
        const data = getFilteredData();
        const groupBy = document.getElementById('groupFilter').value;
        const aggregated = groupBy === 'date' ? aggregateByDate(data) : aggregateByStore(data);

        updateKPIs(data);
        updateCharts(aggregated, groupBy);
        updateTable(data);

        // Handle comparison
        const compareSection = document.getElementById('compareSection');
        const dateStart = document.getElementById('dateStart').value;
        const dateEnd = document.getElementById('dateEnd').value;
        const compareModeEl = document.getElementById('compareMode');
        const compareMode = compareModeEl ? compareModeEl.value : 'none';
        const singleCompare = document.getElementById('compareDate').value;
        const compareStart = document.getElementById('compareStart').value;
        const compareEnd = document.getElementById('compareEnd').value;

        if (compareEnabled && dateStart && dateEnd) {
            compareSection.style.display = '';
            renderComparison(dateStart, dateEnd, singleCompare, compareStart, compareEnd, compareMode, aggregated);
        } else {
            compareSection.style.display = 'none';
        }
    }

    function updateKPIs(data) {
        const totalRevenue = data.reduce((s, d) => s + d.revenue, 0);
        const totalIncome = data.reduce((s, d) => s + d.income, 0);
        const totalOrders = data.reduce((s, d) => s + d.orders, 0);
        const avgRevenue = totalOrders > 0 ? Math.round(totalRevenue / totalOrders) : 0;
        const avgIncome = totalOrders > 0 ? Math.round(totalIncome / totalOrders) : 0;

        document.getElementById('kpiRevenue').textContent = formatMoney(totalRevenue);
        document.getElementById('kpiIncome').textContent = formatMoney(totalIncome);
        document.getElementById('kpiOrders').textContent = totalOrders.toLocaleString();
        document.getElementById('kpiRate').textContent = '¥' + avgRevenue;
        document.getElementById('kpiIncomeAvg').textContent = '¥' + avgIncome;
    }

    let currentAggregated = [];
    let currentGroupBy = 'date';

    function updateCharts(data, groupBy) {
        currentAggregated = data;
        currentGroupBy = groupBy;
        const labels = groupBy === 'date' 
            ? data.map(d => d.date.slice(5)) 
            : data.map(d => d.store.replace('milkplus（', '').replace('）', ''));

        // Revenue chart
        charts.revenue.setOption({
            xAxis: { data: labels },
            series: [{
                data: data.map(d => d.revenue)
            }]
        });

        // Profit chart
        charts.profit.setOption({
            xAxis: { data: labels },
            series: [
                { data: data.map(d => d.income) },
                { data: data.map(d => d.discount), label: { show: true, position: 'top', formatter: function(params) { const rev = data[params.dataIndex] ? data[params.dataIndex].revenue : 0; return rev > 0 ? (params.value / rev * 100).toFixed(1) + '%' : ''; }, fontSize: 10, color: '#f97316', fontWeight: 'bold' } }
            ]
        });

        // Orders chart
        charts.orders.setOption({
            xAxis: { data: labels },
            series: [{
                data: data.map(d => d.orders)
            }]
        });

        // Avg chart
        updateAvgChart(data);
    }

    function updateTable(data) {
        const tbody = document.getElementById('tableBody');

        tbody.innerHTML = sorted.map(d => `

                <td class="num">¥${d.orders > 0 ? Math.round(d.revenue / d.orders) : 0}</td>
                <td class="num">¥${d.orders > 0 ? Math.round(d.income / d.orders) : 0}</td>
            </tr>
        `).join('');
    }

    function getFilteredRawData() {
        // Returns filtered RAW_DATA respecting store & channel filters, but NOT main date range
        // (so comparison can look up data outside the current period)
        const storeSelected = getSelectedValues(document.getElementById('storeFilter'));
        const channelSelected = getSelectedValues(document.getElementById('channelFilter'));
        const storeAll = storeSelected.includes('all');
        const channelAll = channelSelected.includes('all');

        let data = RAW_DATA.filter(d => {
            if (!storeAll && !storeSelected.includes(d.store)) return false;
            return true;
        });

        if (!channelAll && channelSelected.length > 0) {
            data = data.map(d => {
                let revenue = 0, income = 0, discount = 0, orders = 0;
                channelSelected.forEach(ch => {
                    if (d.channels[ch]) {
                        revenue += d.channels[ch].revenue;
                        income += d.channels[ch].income;
                        discount += d.channels[ch].discount;
                        orders += d.channels[ch].orders;
                    }
                });
                return { ...d, revenue, income, discount, orders, diners: 0 };
            });
        }

        return data;
    }

    function aggregateByDateOrNull(data) {
        // Aggregate data by date, returns array or null
        if (!data || !data.length) return null;
        const map = {};
        data.forEach(d => {
            if (!map[d.date]) {
                map[d.date] = { date: d.date, revenue: 0, income: 0, discount: 0, orders: 0, diners: 0 };
            }
            map[d.date].revenue += d.revenue;
            map[d.date].income += d.income;
            map[d.date].discount += d.discount;
            map[d.date].orders += d.orders;
            map[d.date].diners += d.diners;
        });
        return Object.values(map).sort((a, b) => a.date.localeCompare(b.date));
    }

    function renderComparison(targetStart, targetEnd, singleCompare, compareStart, compareEnd, compareMode, aggregated) {
        // Uses filtered data to respect store/channel filters
        const filteredData = getFilteredRawData();

        const findItemFromFiltered = (dateStr) => {
            const dayData = filteredData.filter(d => d.date === dateStr);
            if (!dayData.length) return null;
            return {
                revenue: dayData.reduce((s, d) => s + d.revenue, 0),
                income: dayData.reduce((s, d) => s + d.income, 0),
                discount: dayData.reduce((s, d) => s + d.discount, 0),
                orders: dayData.reduce((s, d) => s + d.orders, 0),
                diners: dayData.reduce((s, d) => s + d.diners, 0),
            };
        };

        const findRangeFromFiltered = (startStr, endStr) => {
            const rangeData = filteredData.filter(d => d.date >= startStr && d.date <= endStr);
            if (!rangeData.length) return null;
            return {
                revenue: rangeData.reduce((s, d) => s + d.revenue, 0),
                income: rangeData.reduce((s, d) => s + d.income, 0),
                discount: rangeData.reduce((s, d) => s + d.discount, 0),
                orders: rangeData.reduce((s, d) => s + d.orders, 0),
                diners: rangeData.reduce((s, d) => s + d.diners, 0),
                days: new Set(rangeData.map(d => d.date)).size,
            };
        };

        if (!charts.compare) {
            charts.compare = echarts.init(document.getElementById('compareBarChart'));
        }
        setTimeout(() => charts.compare.resize(), 50);

        const target = findRangeFromFiltered(targetStart, targetEnd);
        let compare, compareLabel, isRangeCompare;

        if (compareMode === 'range' && compareStart && compareEnd) {
            compare = findRangeFromFiltered(compareStart, compareEnd);
            compareLabel = compareStart.slice(5) + '~' + compareEnd.slice(5);
            isRangeCompare = true;
        } else {
            compare = findItemFromFiltered(singleCompare);
            compareLabel = singleCompare;
            isRangeCompare = false;
        }

        if (!target || !compare) {
            document.getElementById('compareCards').innerHTML = '<p style="color:#999">所选日期范围内无数据</p>';
            charts.compare.clear();
            return;
        }

        const targetDaysInfo = target && target.days ? ` (${target.days}天)` : '';
        const daysInfo = isRangeCompare && compare.days ? ` (${compare.days}天)` : '';

        // Render comparison cards
        const revAvgTarget = target.orders > 0 ? target.revenue / target.orders : 0;
        const revAvgCompare = compare.orders > 0 ? compare.revenue / compare.orders : 0;
        const incAvgTarget = target.orders > 0 ? target.income / target.orders : 0;
        const incAvgCompare = compare.orders > 0 ? compare.income / compare.orders : 0;

        const metrics = [
            { name: '营业额', val1: target.revenue, val2: compare.revenue, unit: '元' },
            { name: '营业收入', val1: target.income, val2: compare.income, unit: '元' },
            { name: '订单量', val1: target.orders, val2: compare.orders, unit: '单' },
            { name: '营业额单均', val1: revAvgTarget, val2: revAvgCompare, unit: '元' },
            { name: '营业收入单均', val1: incAvgTarget, val2: incAvgCompare, unit: '元' },
        ];

        document.getElementById('compareCards').innerHTML = metrics.map(m => {
            const diff = m.val1 - m.val2;
            const pct = m.val2 > 0 ? ((diff / m.val2) * 100) : 0;
            const arrow = pct >= 0 ? '↑' : '↓';
            const color = pct >= 0 ? '#22c55e' : '#ef4444';
            const fmt = (v) => m.unit === '元' ? (m.name.includes('单均') ? '¥' + v.toFixed(1) : Math.round(v).toLocaleString()) : v.toLocaleString();
            const diffUnit = m.unit === '元' && !m.name.includes('单均') ? '元' : m.unit === '单' ? '单' : '';
            return `<div style="background:#f8fafc;border-radius:8px;padding:14px">
                <div style="font-size:12px;color:#888">${m.name}</div>
                <div style="display:flex;justify-content:space-between;margin-top:6px">
                    <div>
                        <div style="font-size:11px;color:#999">${targetStart.slice(5)}~${targetEnd.slice(5)}${targetDaysInfo}</div>
                        <div style="font-size:20px;font-weight:700;color:#1e3c72">${fmt(m.val1)}</div>
                    </div>
                    <div style="text-align:right">
                        <div style="font-size:11px;color:#999">${compareLabel.slice(5)}${daysInfo}</div>
                        <div style="font-size:15px;color:#666">${fmt(m.val2)}</div>
                    </div>
                </div>
                <div style="margin-top:6px;font-size:13px;color:${color};font-weight:600">
                    ${arrow} ${Math.abs(diff).toLocaleString()}${diffUnit} (${Math.abs(pct).toFixed(1)}%)
                </div>
            </div>`;
        }).join('');

        document.getElementById('compareTitle').textContent = `数据对比：${targetStart.slice(5)}~${targetEnd.slice(5)}${targetDaysInfo} vs ${compareLabel.slice(5)}${daysInfo}`;

        // Render bar chart - side by side comparison
        const compColors = getColors();
        charts.compare.setOption({
            tooltip: {
                trigger: 'axis',
                axisPointer: { type: 'shadow' },
                formatter: params => params.map(p => p.marker + p.seriesName + ': ' + (params[0].dataIndex < 2 ? '¥' + Math.round(p.value).toLocaleString() : p.value.toLocaleString())).join('<br>')
            },
            legend: { data: [targetStart.slice(5) + '~' + targetEnd.slice(5) + (isRangeCompare ? '' : ' (' + (target.days||0) + '天)'), compareLabel.slice(5) + (isRangeCompare ? ' (' + (compare.days||0) + '天)' : '')], top: 0 },
            xAxis: { type: 'category', data: ['营业额(万元)', '营业收入(万元)', '订单量(百)', '营业额单均(元)', '营业收入单均(元)'] },
            yAxis: { type: 'value' },
            series: [
                {name: targetStart.slice(5) + '~' + targetEnd.slice(5), type: 'bar', data: [+(target.revenue / 10000).toFixed(1), +(target.income / 10000).toFixed(1), +(target.orders / 100).toFixed(0), +revAvgTarget.toFixed(1), +incAvgTarget.toFixed(1)], itemStyle: { color: compColors.revenue, borderRadius: [4, 4, 0, 0] }, barWidth: '35%'},
                { name: compareLabel.slice(5) + (isRangeCompare ? ' (区间)' : ''), type: 'bar', data: [+(compare.revenue / 10000).toFixed(1), +(compare.income / 10000).toFixed(1), +(compare.orders / 100).toFixed(0), +revAvgCompare.toFixed(1), +incAvgCompare.toFixed(1)], itemStyle: { color: '#94a3b8', borderRadius: [4, 4, 0, 0] }, barWidth: '35%' }
            ],
            grid: { left: 60, right: 20, top: 40, bottom: 30 }
        }, true);
    }

    // ==================== Color Management ====================
    const DEFAULT_COLORS = {
        revenue: '#2a5298',
        income: '#22c55e',
        discount: '#f97316',
        orders: '#7c3aed',
        avgRev: '#f59e0b',
        avgInc: '#06b6d4',
    };

    function getColors() {
        const saved = localStorage.getItem('dashboardColors');
        return saved ? JSON.parse(saved) : { ...DEFAULT_COLORS };
    }

    function saveColors(colors) {
        localStorage.setItem('dashboardColors', JSON.stringify(colors));
    }

    function toggleColorPanel() {
        const panel = document.getElementById('colorPanel');
        panel.classList.toggle('open');
        if (panel.classList.contains('open')) {
            const colors = getColors();
            document.getElementById('colRevenue').value = colors.revenue;
            document.getElementById('colIncome').value = colors.income;
            document.getElementById('colDiscount').value = colors.discount;
            document.getElementById('colOrders').value = colors.orders;
            document.getElementById('colAvgRev').value = colors.avgRev;
            document.getElementById('colAvgInc').value = colors.avgInc;
        }
    }

    function applyColors() {
        const colors = {
            revenue: document.getElementById('colRevenue').value,
            income: document.getElementById('colIncome').value,
            discount: document.getElementById('colDiscount').value,
            orders: document.getElementById('colOrders').value,
            avgRev: document.getElementById('colAvgRev').value,
            avgInc: document.getElementById('colAvgInc').value,
        };
        saveColors(colors);
        // Re-init charts to apply new colors
        Object.values(charts).forEach(c => { if (c) c.dispose(); });
        charts = {};
        initCharts();
        document.getElementById('colorPanel').classList.remove('open');
    }

    function resetColors() {
        localStorage.removeItem('dashboardColors');
        const colors = { ...DEFAULT_COLORS };
        document.getElementById('colRevenue').value = colors.revenue;
        document.getElementById('colIncome').value = colors.income;
        document.getElementById('colDiscount').value = colors.discount;
        document.getElementById('colOrders').value = colors.orders;
        document.getElementById('colAvgRev').value = colors.avgRev;
        document.getElementById('colAvgInc').value = colors.avgInc;
        Object.values(charts).forEach(c => { if (c) c.dispose(); });
        charts = {};
        initCharts();
        document.getElementById('colorPanel').classList.remove('open');
    }

    // Helper to get color with opacity for areas
    function hexToRgba(hex, alpha) {
        const r = parseInt(hex.slice(1, 3), 16);
        const g = parseInt(hex.slice(3, 5), 16);
        const b = parseInt(hex.slice(5, 7), 16);
        return `rgba(${r},${g},${b},${alpha})`;
    }

    function showDetail(category, label, dataPoint) {
        const panel = document.getElementById('detailPanel');
        const title = document.getElementById('detailTitle');
        const content = document.getElementById('detailContent');

        title.textContent = `${label} - 数据明细`;

        // Find matching data from currentAggregated
        const item = currentAggregated.find(d => {
            if (currentGroupBy === 'date') {
                return d.date.slice(5) === label || d.date === label;
            } else {
                return d.store.includes(label) || d.store.replace('milkplus（', '').replace('）', '') === label;
            }
        });

        if (!item) {
            content.innerHTML = '<p style="color:#999">未找到匹配数据</p>';
        } else {
            // Filter raw data for this item
            let matchingRows = [];
            const channel = document.getElementById('channelFilter').value;

            if (currentGroupBy === 'date') {
                // Show all stores for this date
                matchingRows = RAW_DATA.filter(d => d.date === item.date || d.date.slice(5) === label);
            } else {
                // Show all dates for this store
                matchingRows = RAW_DATA.filter(d => d.store === item.store || d.store.includes(label));
            }

            let rows = '';
            matchingRows.sort((a, b) => a.store.localeCompare(b.store)).forEach(d => {
                rows += `<tr style="font-weight:600;border-top:2px solid #e2e8f0">
                    <td>${currentGroupBy === 'date' ? d.store.replace('milkplus（', '').replace('）', '') : d.date.slice(5)}</td>
                    <td class="num">${formatMoney(d.revenue)}</td>
                    <td class="num">${formatMoney(d.income)}</td>
                    <td class="num">${formatMoney(d.discount)}</td>
                    <td class="num">${d.orders.toLocaleString()}</td>
                    <td class="num">${d.revenue > 0 ? (d.income / d.revenue * 100).toFixed(1) : '0'}%</td>
                </tr>`;
                if (channel === 'all') {
                    ['店内销售', '美团外卖', '淘宝闪购', '京东秒送'].forEach(ch => {
                        const c = d.channels[ch];
                        if (c && c.revenue > 0) {
                            rows += `<tr style="background:#f8fafc;font-size:12px">
                                <td style="padding-left:30px;color:#666">&#8226; ${ch}</td>
                                <td class="num">${formatMoney(c.revenue)}</td>
                                <td class="num">${formatMoney(c.income)}</td>
                                <td class="num">${formatMoney(c.discount)}</td>
                                <td class="num">${c.orders}</td>
                                <td></td>
                            </tr>`;
                        }
                    });
                }
            });

            content.innerHTML = `
                <div class="table-wrapper">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>${currentGroupBy === 'date' ? '门店' : '日期'}</th>
                                <th class="num">营业额(元)</th>
                                <th class="num">营业收入(元)</th>
                                <th class="num">优惠金额(元)</th>
                                <th class="num">订单量</th>
                                <th class="num">营业额单均(元)</th>
                            </tr>
                        </thead>
                        <tbody>${rows}</tbody>
                    </table>
                </div>
                <p style="margin-top:10px;font-size:12px;color:#999">共 ${matchingRows.length} 条记录 | 点击每条记录可查看各渠道明细</p>
            `;
        }

        panel.classList.add('active');
        panel.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    function closeDetail() {
        document.getElementById('detailPanel').classList.remove('active');
    }

    function scrollToDetail() {
        document.getElementById('detailPanel').scrollIntoView({ behavior: 'smooth' });
    }

    function formatMoney(val) {
        return Math.round(val).toLocaleString();
    }

    // Handle resize
    window.addEventListener('resize', () => {
        Object.values(charts).forEach(c => c && c.resize());
    });

    init();
    </script>
</body>
</html>
